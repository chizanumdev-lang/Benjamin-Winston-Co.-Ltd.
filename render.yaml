# The database is hosted on Neon. Set DATABASE_URL in the Render dashboard
# (Environment → DATABASE_URL) to the Neon connection string; it is never
# committed to the repo.
services:
  - type: web
    name: bw-catalogue
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
