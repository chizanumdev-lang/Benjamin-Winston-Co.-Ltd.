databases:
  - name: bw-catalogue-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: bw-catalogue
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bw-catalogue-db
          property: connectionString
